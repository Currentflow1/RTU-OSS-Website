{% extends "base.html" %}

{% block title %}
    Search — RTUOSS Digital Library
{% endblock title %}

{% block content %}

<section class="border-b border-[#d8c3a8] bg-[#f3eadc]">
    <div class="mx-auto max-w-5xl px-6 py-8 lg:px-8">

        <p class="text-xs font-semibold uppercase tracking-[0.18em] text-[#9a6942]">
            Archive Search
        </p>

        <h2 class="mt-2 text-2xl font-bold tracking-tight text-[#3f2618] sm:text-3xl">
            Search Results
        </h2>

        <p class="mt-2 text-sm text-[#765c48]">
            Search the RTUOSS institutional research archive.
        </p>

    </div>
</section>


<section class="bg-[#fffaf2]">
    <div class="mx-auto max-w-5xl px-6 py-10 lg:px-8">

        <form
            method="get"
            action="{% url 'research:search' %}"
            class="mb-8 rounded-xl border border-[#d8c3a8] bg-[#fffdf8] p-4"
        >

            <div class="flex flex-col gap-3 sm:flex-row">

                <div class="flex-1">

                    <label
                        for="search-query"
                        class="mb-1.5 block text-xs font-semibold uppercase tracking-[0.12em] text-[#765c48]"
                    >
                        Search
                    </label>

                    <input
                        id="search-query"
                        type="search"
                        name="q"
                        value="{{ query }}"
                        placeholder="Title, author, keyword..."
                        class="w-full rounded-lg border border-[#cdb89f] bg-[#fffaf2] px-4 py-2.5 text-sm text-[#4a2d1c] outline-none placeholder:text-[#9b8068] focus:border-[#8a5a36] focus:ring-2 focus:ring-[#9a6942]/20"
                    >

                </div>


                <div class="sm:w-56">

                    <label
                        for="research-field"
                        class="mb-1.5 block text-xs font-semibold uppercase tracking-[0.12em] text-[#765c48]"
                    >
                        Research Field
                    </label>

                    <select
                        id="research-field"
                        name="field"
                        class="w-full rounded-lg border border-[#cdb89f] bg-[#fffaf2] px-4 py-2.5 text-sm text-[#4a2d1c] outline-none focus:border-[#8a5a36] focus:ring-2 focus:ring-[#9a6942]/20"
                    >

                        <option value="">
                            All fields
                        </option>

                        {% for item in fields %}
                            <option
                                value="{{ item.slug }}"
                                {% if field == item.slug %}selected{% endif %}
                            >
                                {{ item.name }}
                            </option>
                        {% endfor %}

                    </select>

                </div>


                <div class="flex items-end">

                    <button
                        type="submit"
                        class="w-full rounded-lg bg-[#6f4328] px-5 py-2.5 text-sm font-semibold text-[#fff8ed] transition hover:bg-[#4d2d1c] sm:w-auto"
                    >
                        Search
                    </button>

                </div>

            </div>

        </form>


        {% include "research/partials/search_results.html" %}

    </div>
</section>
{% endblock content %}

{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title>
        {% block title %}
            RTUOSS Digital Library
        {% endblock title %}
    </title>

    <link
        rel="icon"
        type="image/png"
        href="{% static 'research/images/emblem.png' %}"
    >

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    {% tailwind_css %}

    <style>
        html {
            overflow-x: hidden;
        }

        body {
            min-width: 320px;
            overflow-x: hidden;
        }

        main {
            min-width: 0;
            animation: page-enter 220ms ease-out;
        }

        img,
        svg,
        video,
        canvas {
            max-width: 100%;
        }

        img {
            height: auto;
        }

        pre,
        code {
            max-width: 100%;
            overflow-x: auto;
        }

        p,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        a,
        span {
            overflow-wrap: break-word;
        }

        @keyframes page-enter {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 640px) {
            main {
                font-size: 0.95rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            main {
                animation: none;
            }
        }
    </style>
</head>

<body class="min-h-screen bg-[#fffaf2] text-[#4a2d1c]">

    {% include "partials/header.html" %}

    <main>
        {% block content %}
        {% endblock content %}
    </main>

    {% include "partials/footer.html" %}

    <script>
        const easterEgg = document.querySelector("#rtuoss-easter-egg");

        if (easterEgg) {
            let clicks = 0;
            let resetTimer;

            easterEgg.addEventListener("click", (event) => {
                event.preventDefault();

                clicks += 1;

                clearTimeout(resetTimer);

                resetTimer = setTimeout(() => {
                    clicks = 0;
                }, 1200);

                if (clicks >= 7) {
                    window.location.href = "{% url 'easter:game' %}";
                }
            });
        }
    </script>

</body>
</html>
